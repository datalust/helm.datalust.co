{{- if or (and .Values.gelf.enabled (not .Values.gelf.existingApiKey.name)) (and .Values.syslog.enabled (not .Values.syslog.existingApiKey.name)) }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    app: {{ template "seq.name" . }}
    chart: {{ template "seq.chart" . }}
    release: {{ .Release.Name }}
  name: {{ template "seq.fullname" . }}-apikeys
data:
  {{- if and .Values.gelf.enabled (not .Values.gelf.existingApiKey.name) }}
  gelf-key: {{ .Values.gelf.apiKey | b64enc | quote }}
  {{- end}}
  {{- if and .Values.syslog.enabled (not .Values.syslog.existingApiKey.name) }}
  syslog-key: {{ .Values.syslog.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
